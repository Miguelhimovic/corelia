[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/ es codigo autogenerado por `alembic revision --autogenerate`
# (Alembic, no el equipo, decide su estilo) -- excluirlo evita que cada
# migracion nueva acumule errores de lint que no son responsabilidad de
# quien la genera.
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) como default de argumento es el patron idiomatico de FastAPI, no un bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
